envVarGroups:
  - name: brain-secrets
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLICKHOUSE_URL
        sync: false
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: SENSO_API_KEY
        sync: false
      - key: SENSO_GEO_QUESTION_ID
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_NOTION_USER_ID
        sync: false
      - key: NOTION_PARENT_PAGE_ID
        sync: false
      - key: NOTION_AUTH_CONFIG_ID
        sync: false
services:
  - type: web
    name: merchant-brain
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - fromGroup: brain-secrets
      - key: NODE_VERSION
        value: "22"
      - key: USE_CACHED_RESEARCH
        value: "1"
# Daily autonomous rerun: Render Cron is a paid-only feature, so it's omitted from
# the free blueprint. To enable it, add a `type: cron` service on a paid plan running
# `npm run agent:daily -- --merchant gearit` (scripts/daily-rerun.ts), or trigger that
# script from any external scheduler.
